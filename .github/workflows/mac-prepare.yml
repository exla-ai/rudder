# Prepare every revision of the versioned candidate, even fixes outside mac/.
name: Prepare Mac release
on:
  push:
    branches: ["release-check/[0-9]*"]
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
    secrets:
      OFFSTAGE_API_KEY:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      ASC_KEY_P8:
        required: false
      MAC_DEVELOPER_ID_P12:
        required: false
      MAC_DEVELOPER_ID_PASSWORD:
        required: false
      SPARKLE_ED_PRIVATE_KEY:
        required: false
permissions:
  contents: read
jobs:
  build:
    concurrency:
      group: mac-build-${{ github.ref }}-${{ inputs.mode || 'prepare' }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PREPARE: ${{ github.event_name == 'push' && inputs.mode == '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the candidate version and signing configuration
        if: env.PREPARE == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          [[ "$GITHUB_REF_NAME" == "release-check/$version" ]] || { echo "Candidate must be release-check/$version"; exit 1; }
          : "${SPARKLE_ED_PRIVATE_KEY:?missing Sparkle signing key}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: offstage SDK
        run: |
          sdk="$RUNNER_TEMP/offstage-cloud-0.3.1.tgz"
          curl -fsSL -o "$sdk" https://api.offstage.cloud/sdk/offstage-cloud-0.3.1.tgz
          echo "804333522a502dc1e61936f38823f5c704696e797d8ee3dda6daa5326ce629b1  $sdk" | sha256sum -c -
          npm install --prefix .offstage --no-save --no-audit --no-fund "$sdk"
      - name: Build on an offstage Mac
        env:
          OFFSTAGE_API_KEY: ${{ secrets.OFFSTAGE_API_KEY }}
          OFFSTAGE_API_URL: https://api.offstage.cloud
          RELEASE: ${{ env.PREPARE }}
          SIGNING_CHECK: ${{ inputs.mode == 'signing-check' }}
          ASC_KEY_ID: ${{ (env.PREPARE == 'true' || inputs.mode == 'signing-check') && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ (env.PREPARE == 'true' || inputs.mode == 'signing-check') && secrets.ASC_ISSUER_ID || '' }}
          ASC_KEY_P8: ${{ (env.PREPARE == 'true' || inputs.mode == 'signing-check') && secrets.ASC_KEY_P8 || '' }}
          MAC_DEVELOPER_ID_P12: ${{ (env.PREPARE == 'true' || inputs.mode == 'signing-check') && secrets.MAC_DEVELOPER_ID_P12 || '' }}
          MAC_DEVELOPER_ID_PASSWORD: ${{ (env.PREPARE == 'true' || inputs.mode == 'signing-check') && secrets.MAC_DEVELOPER_ID_PASSWORD || '' }}
        run: node .offstage/mac.mjs
      - name: Sign the update feed for this candidate
        if: env.PREPARE == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bash mac/scripts/prepared-release.sh sign offstage-out/mac/build
      - uses: actions/upload-artifact@v4
        if: env.PREPARE == 'true'
        with:
          name: mac-release-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            offstage-out/mac/build/Rudder.dmg
            offstage-out/mac/build/appcast.xml
            offstage-out/mac/build/release.env
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-logs
          path: |
            offstage-out/mac/*.log
            offstage-out/mac/build/*.json
          if-no-files-found: ignore
