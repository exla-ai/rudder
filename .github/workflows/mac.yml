name: Mac

# A by-hand check of the Mac app on an Offstage Mac: the core tests and a Debug
# build, or with signing_check the Developer ID signing and notarization too,
# without publishing. Every Rudder version builds, signs and publishes the Mac
# app in release.yml.
on:
  workflow_dispatch:
    inputs:
      signing_check:
        description: "Also sign and notarize, without publishing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Offstage SDK
        run: |
          sdk="$RUNNER_TEMP/offstage-cloud-0.3.1.tgz"
          curl -fsSL -o "$sdk" https://api.offstage.cloud/sdk/offstage-cloud-0.3.1.tgz
          echo "804333522a502dc1e61936f38823f5c704696e797d8ee3dda6daa5326ce629b1  $sdk" | sha256sum -c -
          npm install --prefix .offstage --no-save --no-audit --no-fund "$sdk"
      - name: Build on an Offstage Mac
        env:
          OFFSTAGE_API_KEY: ${{ secrets.OFFSTAGE_API_KEY }}
          OFFSTAGE_API_URL: https://api.offstage.cloud
          SIGNING_CHECK: ${{ inputs.signing_check }}
          ASC_KEY_ID: ${{ inputs.signing_check && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ inputs.signing_check && secrets.ASC_ISSUER_ID || '' }}
          ASC_KEY_P8: ${{ inputs.signing_check && secrets.ASC_KEY_P8 || '' }}
          MAC_DEVELOPER_ID_P12: ${{ inputs.signing_check && secrets.MAC_DEVELOPER_ID_P12 || '' }}
          MAC_DEVELOPER_ID_PASSWORD: ${{ inputs.signing_check && secrets.MAC_DEVELOPER_ID_PASSWORD || '' }}
        run: node .offstage/mac.mjs
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-logs
          path: |
            offstage-out/mac/*.log
            offstage-out/mac/build/*.json
          if-no-files-found: ignore
