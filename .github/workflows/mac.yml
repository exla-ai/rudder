name: Mac

on:
  push:
    branches-ignore: ["release-check/[0-9]*"]
    # Path filters do not apply to tags: every version tag releases.
    tags: ["v*"]
    paths:
      - "mac/**"
      - ".offstage/**"
      - ".github/workflows/mac.yml"
      - ".github/workflows/mac-prepare.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the prepared Mac release for this version tag"
        type: boolean
        default: false
      signing_check:
        description: "Sign and notarize on Offstage without publishing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    if: inputs.release != true && !startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/mac-prepare.yml
    secrets:
      OFFSTAGE_API_KEY: ${{ secrets.OFFSTAGE_API_KEY }}
      ASC_KEY_ID: ${{ inputs.signing_check == true && secrets.ASC_KEY_ID || '' }}
      ASC_ISSUER_ID: ${{ inputs.signing_check == true && secrets.ASC_ISSUER_ID || '' }}
      ASC_KEY_P8: ${{ inputs.signing_check == true && secrets.ASC_KEY_P8 || '' }}
      MAC_DEVELOPER_ID_P12: ${{ inputs.signing_check == true && secrets.MAC_DEVELOPER_ID_P12 || '' }}
      MAC_DEVELOPER_ID_PASSWORD: ${{ inputs.signing_check == true && secrets.MAC_DEVELOPER_ID_PASSWORD || '' }}
    with:
      mode: ${{ inputs.signing_check == true && 'signing-check' || 'check' }}
  publish:
    if: inputs.release == true || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    concurrency:
      group: mac-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /cloud/fly.toml
            /mac/App/Info.plist
            /mac/project.yml
            /mac/scripts/prepared-release.sh
            /mac/scripts/appcast.mjs
      - name: Fetch the successful preparation for this tag and commit
        run: |
          version="$(node -p 'require("./package.json").version')"
          [[ "$GITHUB_REF" == "refs/tags/v$version" ]] || { echo "Run against the v$version tag"; exit 1; }
          run="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/mac-prepare.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch="release-check/$version" -f event=push -f status=success \
            --jq '.workflow_runs[0] | select(. != null) | [.id, .run_attempt] | @tsv')"
          [[ -n "$run" ]] || { echo "Prepare release-check/$version at $GITHUB_SHA first"; exit 1; }
          read -r id attempt <<< "$run"
          gh run download "$id" -n "mac-release-$GITHUB_SHA-$attempt" -D prepared
          bash mac/scripts/prepared-release.sh verify prepared
      - name: Wait for the matching Cloud release
        run: |
          image="$(sed -n 's/^ *RUDDER_WORKER_IMAGE = "\([^"]*\)"$/\1/p' cloud/fly.toml)"
          version="$(sed -n 's/^VERSION=//p' prepared/release.env)"
          if [[ -z "$version" || "$image" != *":$version" ]]; then
            echo "::error::The signed Mac version does not match the worker image in cloud/fly.toml"
            exit 1
          fi
          echo "Waiting for Cloud to serve $image"
          for attempt in {1..180}; do
            if curl -fsS --max-time 10 -H 'Cache-Control: no-cache' https://rudder.exla.ai/health \
              | jq -e --arg image "$image" '.ok == true and .workerImage == $image' >/dev/null \
              && curl -fsSL --max-time 10 https://rudder.exla.ai/app -o /dev/null; then
              echo "MAC_READY_AT=$(date +%s)" >> "$GITHUB_ENV"
              echo "Cloud is healthy on $image"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Cloud did not report a healthy deployment of $image. The Mac release is held."
          exit 1
      - name: Publish the verified download and update feed
        run: bash mac/scripts/prepared-release.sh publish prepared
      - name: Measure availability on the public download and Sparkle feed
        run: |
          verify_public() {
            local url="$1" file="$2"
            for attempt in {1..6}; do
              if curl -fsSL --max-time 20 "$url" -o "$RUNNER_TEMP/$file" && cmp -s "prepared/$file" "$RUNNER_TEMP/$file"; then
                return 0
              fi
              sleep 2
            done
            echo "::error::$url does not serve the prepared $file"
            return 1
          }
          verify_public https://rudder.exla.ai/download/mac Rudder.dmg &
          dmg=$!
          verify_public "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" appcast.xml &
          feed=$!
          status=0
          wait "$dmg" || status=1
          wait "$feed" || status=1
          [[ "$status" == 0 ]] || exit 1
          echo "Public DMG and Sparkle feed verified $(( $(date +%s) - MAC_READY_AT ))s after Cloud health confirmation." >> "$GITHUB_STEP_SUMMARY"
