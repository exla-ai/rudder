# The Mac app on an offstage Mac, driven from Linux through the offstage API
# (.offstage/mac.mjs; the job's runner never builds anything). Every change
# under mac/ is compiled and its core tested (the Linux home machine cannot),
# and a manual run with `release: true` archives, signs with Developer ID,
# notarizes and staples the app, wraps it in Rudder.dmg (notarized and stapled
# too) and publishes it as the latest GitHub release, which
# https://rudder.exla.ai/download/mac serves. The steps themselves are
# mac/scripts/ci.sh (check, sign, notarize, dmg).
#
# Secrets: OFFSTAGE_API_KEY (the offstage team key), and for a release the
# App Store Connect key (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) that signs
# with Xcode's cloud-managed Developer ID and notarizes, as in ios.yml. It
# reaches the Mac only as the environment of the commands that need it, and
# the sandbox account is wiped when the job ends. Bump MARKETING_VERSION /
# CURRENT_PROJECT_VERSION in mac/project.yml, push, then
# `gh workflow run mac.yml -f release=true` and `gh run watch`.
name: Mac

on:
  push:
    paths:
      - "mac/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Sign, notarize and publish Rudder.dmg"
        type: boolean
        default: false

concurrency:
  group: mac-${{ github.ref }}-${{ inputs.release || false }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: offstage SDK
        run: |
          sdk="$RUNNER_TEMP/offstage-cloud-0.3.1.tgz"
          curl -fsSL -o "$sdk" https://api.offstage.cloud/sdk/offstage-cloud-0.3.1.tgz
          echo "804333522a502dc1e61936f38823f5c704696e797d8ee3dda6daa5326ce629b1  $sdk" | sha256sum -c -
          npm install --prefix .offstage --no-save --no-audit --no-fund "$sdk"
      - name: Build on an offstage Mac
        env:
          OFFSTAGE_API_KEY: ${{ secrets.OFFSTAGE_API_KEY }}
          OFFSTAGE_API_URL: https://api.offstage.cloud
          RELEASE: ${{ inputs.release == true }}
          ASC_KEY_ID: ${{ inputs.release == true && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ inputs.release == true && secrets.ASC_ISSUER_ID || '' }}
          ASC_KEY_P8: ${{ inputs.release == true && secrets.ASC_KEY_P8 || '' }}
        run: node .offstage/mac.mjs
      - name: Publish the release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . offstage-out/mac/build/release.env
          TAG="mac-v$VERSION-$BUILD"
          dmg=offstage-out/mac/build/Rudder.dmg
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" --clobber
          else
            gh release create "$TAG" "$dmg" --latest --target "$GITHUB_SHA" \
              --title "Rudder for Mac $VERSION ($BUILD)" \
              --notes "Rudder for macOS $VERSION, signed with Developer ID and notarized. Download: https://rudder.exla.ai/download/mac"
          fi
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-logs
          path: offstage-out
          if-no-files-found: ignore
