name: Release

# Ships one Rudder version to npm and as the Mac app, from one commit. GitHub
# builds and tests nothing here; scripts/release.mjs describes the flow.
#
#   release-check/X.Y.Z push  Offstage Macs build the darwin-arm64 pair and the
#                             signed, notarized Rudder.dmg, and the Sparkle feed
#                             is signed here. Both go into the draft release vX.Y.Z.
#   the home                  runs the full checks once, then
#                             `node scripts/release.mjs stage` builds linux-x64,
#                             packs the npm tarball with both pairs and adds it.
#   vX.Y.Z tag, same commit   checks every staged hash and publishes: npm through
#                             trusted publishing (OIDC, no token), then the Mac
#                             app once Cloud runs the X.Y.Z worker image. A failed
#                             job can be re-run: publishing checks npm and the
#                             Mac release first, so nothing publishes twice.
#
# npm trusts this file by name (.github/workflows/release.yml); keep it.

on:
  push:
    tags: ["v*"]
    branches: ["release-check/**"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A new push to release-check/X.Y.Z replaces the staging in flight and frees
  # its Offstage credit. A tag run always finishes.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  GH_TOKEN: ${{ github.token }}
  OFFSTAGE_SDK_SHA256: 804333522a502dc1e61936f38823f5c704696e797d8ee3dda6daa5326ce629b1

jobs:
  draft:
    name: Draft release
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check the release secrets
        env:
          OFFSTAGE_API_KEY: ${{ secrets.OFFSTAGE_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          for name in OFFSTAGE_API_KEY ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 MAC_DEVELOPER_ID_P12 MAC_DEVELOPER_ID_PASSWORD SPARKLE_ED_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The $name repo secret is not set"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create or retarget the draft release
        run: node scripts/release.mjs draft

  darwin:
    name: darwin-arm64 pair on Offstage
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Offstage SDK
        run: |
          sdk="$RUNNER_TEMP/offstage-cloud-0.3.1.tgz"
          curl -fsSL -o "$sdk" https://api.offstage.cloud/sdk/offstage-cloud-0.3.1.tgz
          echo "$OFFSTAGE_SDK_SHA256  $sdk" | sha256sum -c -
          npm install --prefix .offstage --no-save --no-audit --no-fund "$sdk"
      - name: Build on an Offstage Mac
        env:
          OFFSTAGE_API_KEY: ${{ secrets.OFFSTAGE_API_KEY }}
          OFFSTAGE_API_URL: https://api.offstage.cloud
        run: node .offstage/native.mjs
      - name: Stage the pair
        run: node scripts/release.mjs put-darwin
      - name: Offstage logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offstage-native-logs
          path: offstage-out/native/
          if-no-files-found: ignore

  mac:
    name: Mac app on Offstage
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Offstage SDK
        run: |
          sdk="$RUNNER_TEMP/offstage-cloud-0.3.1.tgz"
          curl -fsSL -o "$sdk" https://api.offstage.cloud/sdk/offstage-cloud-0.3.1.tgz
          echo "$OFFSTAGE_SDK_SHA256  $sdk" | sha256sum -c -
          npm install --prefix .offstage --no-save --no-audit --no-fund "$sdk"
      - name: Test, sign and notarize on an Offstage Mac
        env:
          OFFSTAGE_API_KEY: ${{ secrets.OFFSTAGE_API_KEY }}
          OFFSTAGE_API_URL: https://api.offstage.cloud
          RELEASE: "true"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
        run: node .offstage/mac.mjs
      - name: Sign the update feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bash mac/scripts/prepared-release.sh sign offstage-out/mac/build
      - name: Stage the DMG and feed
        run: node scripts/release.mjs put-mac offstage-out/mac/build
      - name: Offstage logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-logs
          path: |
            offstage-out/mac/*.log
            offstage-out/mac/build/*.json
          if-no-files-found: ignore

  npm:
    name: Publish npm
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # read the draft release: drafts need push access
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Use npm 11
        run: npm install -g npm@11.21.1
      - name: Verify the staged tarball and publish it
        run: node scripts/release.mjs publish-npm

  mac-publish:
    name: Publish the Mac app
    needs: npm
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: mac-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch and verify the staged DMG and feed
        run: |
          node scripts/release.mjs fetch-mac prepared
          bash mac/scripts/prepared-release.sh verify prepared
      - name: Wait for the matching Cloud release
        run: |
          image="$(sed -n 's/^ *RUDDER_WORKER_IMAGE = "\([^"]*\)"$/\1/p' cloud/fly.toml)"
          version="$(sed -n 's/^VERSION=//p' prepared/release.env)"
          if [[ -z "$version" || "$image" != *":$version" ]]; then
            echo "::error::The signed Mac version does not match the worker image in cloud/fly.toml"
            exit 1
          fi
          echo "Waiting for Cloud to serve $image"
          for _ in {1..180}; do
            if curl -fsS --max-time 10 -H 'Cache-Control: no-cache' https://rudder.exla.ai/health \
              | jq -e --arg image "$image" '.ok == true and .workerImage == $image' >/dev/null \
              && curl -fsSL --max-time 10 https://rudder.exla.ai/app -o /dev/null; then
              echo "MAC_READY_AT=$(date +%s)" >> "$GITHUB_ENV"
              echo "Cloud is healthy on $image"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Cloud did not report a healthy deployment of $image. The Mac release is held; re-run this job once Cloud runs it."
          exit 1
      - name: Publish the verified download and update feed
        run: bash mac/scripts/prepared-release.sh publish prepared
      - name: Check the public download and Sparkle feed
        run: |
          verify_public() {
            local url="$1" file="$2"
            for _ in {1..18}; do
              if curl -fsSL --max-time 20 "$url" -o "$RUNNER_TEMP/$file" && cmp -s "prepared/$file" "$RUNNER_TEMP/$file"; then
                return 0
              fi
              sleep 5
            done
            echo "::error::$url does not serve the prepared $file"
            return 1
          }
          verify_public https://rudder.exla.ai/download/mac Rudder.dmg &
          dmg=$!
          verify_public "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" appcast.xml &
          feed=$!
          status=0
          wait "$dmg" || status=1
          wait "$feed" || status=1
          [[ "$status" == 0 ]] || exit 1
          verified=$(date +%s)
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          {
            echo "Public DMG and Sparkle feed verified."
            echo "- From the tag run's start: $(( verified - $(date -d "$started" +%s) ))s"
            echo "- From Cloud health confirmation: $(( verified - MAC_READY_AT ))s"
          } >> "$GITHUB_STEP_SUMMARY"

  finish:
    name: Remove the draft
    needs: [npm, mac-publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Delete the draft release and release-check branch
        run: node scripts/release.mjs finish
