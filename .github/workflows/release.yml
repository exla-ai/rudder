name: Release

# Publishes @exla/rudder to npm when a vX.Y.Z tag is pushed, so the
# published version is always pinned to a committed git tag. No more repo vs
# registry drift.
#
# Release flow (from clean main with feature changes committed):
#   npm version <version>    # creates final local version commit/tag; do not push tag yet
#   git push origin HEAD:release-check/<version>  # full matrix/tests at FINAL SHA, no publish
#   git push origin main vX.Y.Z  # after green, push the SAME SHA and explicit local tag
#
# One-time setup: add an npm "Automation" access token as the repo secret
# NPM_TOKEN (Settings -> Secrets and variables -> Actions -> New secret).
# Generate it at npmjs.com -> Access Tokens -> Generate New Token -> Automation.

on:
  push:
    tags:
      - "v*"
    # Every platform check, without the tag and publish steps, so a failure
    # costs a branch push instead of a version (several alphas between
    # alpha.9 and alpha.17 failed only after tagging).
    branches:
      - "release-check/**"

jobs:
  reuse:
    name: Release reuse probe
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.ready.outputs.eligible }}
      native_ids: ${{ steps.record.outputs.native_ids }}
      proof_id: ${{ steps.proof.outputs.artifact-id }}
      proof_digest: ${{ steps.proof.outputs.artifact-digest }}
      proof_sha256: ${{ steps.record.outputs.proof_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # These are optional discovery/staging steps, never qualification gates.
      # Positive eligibility is emitted only after ALL evidence/copies are ready.
      - name: Select trusted exact-SHA qualification
        id: select
        continue-on-error: true
        run: node scripts/release-reuse.mjs select
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download exact originating native artifacts
        id: download
        if: steps.select.outcome == 'success' && steps.select.outputs.found == 'true'
        continue-on-error: true
        run: node scripts/release-reuse.mjs fetch-origin
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Recheck origin and verify every native hash
        id: verify
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: node scripts/release-reuse.mjs verify-origin
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stage reused darwin-arm64
        id: arm
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reuse-rudder-native-darwin-arm64
          path: prebuilt-native/rudder-native-darwin-arm64/
          if-no-files-found: error
      - name: Stage reused linux-x64
        id: linux
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reuse-rudder-native-linux-x64
          path: prebuilt-native/rudder-native-linux-x64/
          if-no-files-found: error
      - name: Record originating and current copy identities
        id: record
        if: steps.arm.outcome == 'success' && steps.linux.outcome == 'success'
        continue-on-error: true
        run: node scripts/release-reuse.mjs record-reuse
        env:
          REUSE_UPLOADS: >-
            [{"name":"reuse-rudder-native-darwin-arm64","id":"${{ steps.arm.outputs.artifact-id }}","digest":"${{ steps.arm.outputs.artifact-digest }}"},
            {"name":"reuse-rudder-native-linux-x64","id":"${{ steps.linux.outputs.artifact-id }}","digest":"${{ steps.linux.outputs.artifact-digest }}"}]
      - name: Upload exact reuse proof
        id: proof
        if: steps.record.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-reuse-proof
          path: release-evidence/reuse.json
          if-no-files-found: error
      - name: Enable reuse only after every copy and proof succeeded
        id: ready
        if: steps.record.outcome == 'success' && steps.proof.outcome == 'success' && steps.proof.outputs.artifact-id != '' && steps.record.outputs.native_ids != '' && steps.record.outputs.proof_sha256 != ''
        run: echo 'eligible=true' >> "$GITHUB_OUTPUT"

  native-artifacts:
    needs: reuse
    # Branch candidates ALWAYS qualify in full. Any failed/unavailable probe also does.
    if: ${{ always() && !cancelled() && (github.ref_type != 'tag' || needs.reuse.result != 'success' || needs.reuse.outputs.eligible != 'true') }}
    name: Native ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: darwin-arm64
            runner: macos-15
            cache_profile: release-fixtures
          - key: linux-x64
            runner: ubuntu-22.04
            cache_profile: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Never use this cache as native artifact or qualification evidence.
      - name: Restore external Rust dependencies
        id: rust_dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rudder-external-deps-v1
          shared-key: "${{ matrix.key }}-${{ matrix.runner }}-${{ matrix.cache_profile }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'native/Cargo.toml', 'engine/Cargo.toml', 'vcs-bridge/Cargo.toml', 'scripts/build-native.mjs', 'rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}"
          workspaces: ". -> target"
          cache-targets: "true"
          cache-workspace-crates: "false"
          cache-all-crates: "false"
          cache-bin: "false"
          cache-on-failure: "false"
          cache-provider: github
          env-vars: "ImageOS ImageVersion SDKROOT DEVELOPER_DIR MACOSX_DEPLOYMENT_TARGET LIBRARY_PATH PKG_CONFIG LDFLAGS AR"
          save-if: "false"

      # Checked cleanup also covers local path dependencies, not just members.
      # A cache can never make source mtimes accept an old local binary.
      - name: Discard any restored local Cargo outputs
        run: |
          git diff --exit-code HEAD -- Cargo.lock Cargo.toml native/Cargo.toml engine/Cargo.toml vcs-bridge/Cargo.toml
          node <<'NODE'
          const cp = require('node:child_process');
          const metadata = JSON.parse(cp.execFileSync('cargo', ['metadata', '--locked', '--all-features', '--format-version', '1'], {encoding: 'utf8', maxBuffer: 16 * 1024 * 1024}));
          const local = metadata.packages.filter(pkg => pkg.source === null).map(pkg => pkg.name);
          if (!local.length) throw new Error('Expected local workspace packages');
          for (const profile of ['dev', 'release']) cp.execFileSync('cargo', ['clean', '--profile', profile, ...local.flatMap(name => ['--package', name])], {stdio: 'inherit'});
          NODE

      # These host/browser fixtures need no Rust artifacts. Check platform
      # paths and opener behavior before spending time compiling the pair.
      - name: Board host access preflight
        run: |
          npm ci --ignore-scripts
          node --test tests/board-capability.test.mjs tests/board-host-access.test.mjs

      - name: Build native pair
        run: node scripts/build-native.mjs

      - name: Stage native artifact
        run: |
          mkdir -p "native-dist/${{ matrix.key }}"
          cp target/release/rudder-native "native-dist/${{ matrix.key }}/rudder-native"
          cp target/release/rudder-jj "native-dist/${{ matrix.key }}/rudder-jj"
          chmod 755 "native-dist/${{ matrix.key }}/rudder-native"
          chmod 755 "native-dist/${{ matrix.key }}/rudder-jj"
          node scripts/native-artifacts.mjs create --directory "native-dist/${{ matrix.key }}" --platform "${{ matrix.key }}" --revision "$GITHUB_SHA"

      - name: Upload native artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: rudder-native-${{ matrix.key }}
          path: native-dist/${{ matrix.key }}/

      - name: Record native upload identity
        run: node scripts/release-reuse.mjs upload-identity
        env:
          NATIVE_PLATFORM: ${{ matrix.key }}
          NATIVE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          NATIVE_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
      - name: Upload native identity
        uses: actions/upload-artifact@v4
        with:
          name: native-upload-${{ matrix.key }}
          path: native-upload-meta/${{ matrix.key }}/upload.json
          if-no-files-found: error

  qualification:
    name: Release qualification
    needs: native-artifacts
    if: ${{ always() && !cancelled() && needs.native-artifacts.result == 'success' }}
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
    outputs:
      native_ids: ${{ steps.certify.outputs.native_ids }}
      proof_id: ${{ steps.proof.outputs.artifact-id }}
      proof_digest: ${{ steps.proof.outputs.artifact-digest }}
      proof_sha256: ${{ steps.certify.outputs.proof_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Never use this cache as native artifact or qualification evidence.
      - name: Restore external Rust dependencies
        id: rust_dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rudder-external-deps-v1
          shared-key: "darwin-arm64-macos-15-release-fixtures-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'native/Cargo.toml', 'engine/Cargo.toml', 'vcs-bridge/Cargo.toml', 'scripts/build-native.mjs', 'rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}"
          workspaces: ". -> target"
          cache-targets: "true"
          cache-workspace-crates: "false"
          cache-all-crates: "false"
          cache-bin: "false"
          cache-on-failure: "false"
          cache-provider: github
          env-vars: "ImageOS ImageVersion SDKROOT DEVELOPER_DIR MACOSX_DEPLOYMENT_TARGET LIBRARY_PATH PKG_CONFIG LDFLAGS AR"
          save-if: "false"

      # Checked cleanup also covers local path dependencies, not just members.
      # A cache can never make source mtimes accept an old local binary.
      - name: Discard any restored local Cargo outputs
        run: |
          git diff --exit-code HEAD -- Cargo.lock Cargo.toml native/Cargo.toml engine/Cargo.toml vcs-bridge/Cargo.toml
          node <<'NODE'
          const cp = require('node:child_process');
          const metadata = JSON.parse(cp.execFileSync('cargo', ['metadata', '--locked', '--all-features', '--format-version', '1'], {encoding: 'utf8', maxBuffer: 16 * 1024 * 1024}));
          const local = metadata.packages.filter(pkg => pkg.source === null).map(pkg => pkg.name);
          if (!local.length) throw new Error('Expected local workspace packages');
          for (const profile of ['dev', 'release']) cp.execFileSync('cargo', ['clean', '--profile', profile, ...local.flatMap(name => ['--package', name])], {stdio: 'inherit'});
          NODE

      # Authenticate the producer sidecar ZIPs against trusted run metadata,
      # then hash every original native ZIP BEFORE extracting any entry.
      - name: Authenticate original native archives before extraction
        id: native_archives
        run: node scripts/release-reuse.mjs fetch-native
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify complete native artifacts and source revision
        id: verify_native
        run: node scripts/native-artifacts.mjs verify --root prebuilt-native --revision "$GITHUB_SHA"

      - name: Configure git (rebase-first test creates temp repos)
        id: git_config
        run: |
          git config --global user.email "ci@rudder.local"
          git config --global user.name "Rudder CI"
          git config --global init.defaultBranch main

      # The native and JS tests drive real jj repos. Rudder's own installer no
      # longer puts jj on the system PATH (it keeps a private copy), so install it.
      # Pinned to the shipped jj (0.40.0); Homebrew's latest breaks the
      # migration tests that read real jj 0.40 repos.
      - name: Install jj
        id: install_jj
        run: |
          mkdir -p "$RUNNER_TEMP/jj"
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.40.0/jj-v0.40.0-aarch64-apple-darwin.tar.gz | tar -xz -C "$RUNNER_TEMP/jj"
          JJ="$(find "$RUNNER_TEMP/jj" -type f -name jj | head -1)"
          chmod +x "$JJ"; echo "$(dirname "$JJ")" >> "$GITHUB_PATH"
          "$JJ" --version

      - name: Install npm dependencies
        id: install
        run: npm ci

      - name: Install + build cloud test fixtures
        id: cloud
        working-directory: cloud
        run: |
          npm ci
          npm run build

      # MCP/broker JS journeys export trusted fixtures from Rust test binaries.
      # Compile outside their short per-fixture timeout on a fresh CI checkout.
      - name: Compile engine and native test fixtures
        id: fixtures
        run: cargo test --workspace --locked --features rudder-vcs-bridge/cli --no-run

      - name: Typecheck + JS tests
        id: js
        run: |
          chmod +x prebuilt-native/rudder-native-darwin-arm64/rudder-native
          chmod +x prebuilt-native/rudder-native-darwin-arm64/rudder-jj
          prebuilt-native/rudder-native-darwin-arm64/rudder-jj --version
          prebuilt-native/rudder-native-darwin-arm64/rudder-jj --help
          npm test
        env:
          RUDDER_NATIVE_BIN: ${{ github.workspace }}/prebuilt-native/rudder-native-darwin-arm64/rudder-native

      - name: Native tests
        id: rust
        run: cargo test --workspace --locked --features rudder-vcs-bridge/cli

      - name: Managed jj provider tests
        id: jj_provider
        run: cargo test --workspace --locked --features rudder-vcs-bridge/cli --test guest_diagnostics --test identities_and_seed --test journal_integration --test projection --test publication --test rpc_view --test vfs_provider --test working_copy

      # Screen-level e2e: the REAL prebuilt dashboard binary in a real PTY,
      # driven by keystrokes via tui-integration-tests (which fetches its own
      # sha256-pinned driver). Uses the darwin-arm64 artifact this job already
      # downloaded; download-artifact does not preserve the execute bit.
      - name: TUI end-to-end tests
        id: tui
        run: |
          chmod +x prebuilt-native/rudder-native-darwin-arm64/rudder-native
          node node_modules/tui-integration-tests/harness/fetch-driver.mjs
          npm run test:tui:report
        env:
          RUDDER_NATIVE_BIN: ${{ github.workspace }}/prebuilt-native/rudder-native-darwin-arm64/rudder-native

      # The report embeds the final screen of every session — on a red run it
      # shows exactly what the dashboard displayed when the test gave up.
      - name: Upload TUI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-report
          path: tui-report.html
          if-no-files-found: ignore

      - name: Record complete qualification
        id: certify
        run: node scripts/release-reuse.mjs certify
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
          EXPECTED_NATIVE_ARCHIVES_SHA256: ${{ steps.native_archives.outputs.proof_sha256 }}
      - name: Upload complete qualification
        id: proof
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification
          path: release-evidence/qualification.json
          if-no-files-found: error

  publish:
    name: Publish npm release
    needs: [reuse, native-artifacts, qualification]
    # No failed qualification job is skipped/bypassed. The alternative requires
    # verified origin evidence AND both expensive current jobs actually skipped.
    if: >-
      ${{ always() && !cancelled() && github.ref_type == 'tag' &&
        ((needs.reuse.result == 'success' && needs.reuse.outputs.eligible == 'true' &&
          needs.native-artifacts.result == 'skipped' && needs.qualification.result == 'skipped') ||
         (needs.native-artifacts.result == 'success' && needs.qualification.result == 'success')) }}
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Download exact qualified native artifacts
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.reuse.outputs.eligible == 'true' && needs.reuse.result == 'success' && needs.reuse.outputs.native_ids || needs.qualification.outputs.native_ids }}
          path: prebuilt-native
      - name: Download exact qualification proof
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.reuse.outputs.eligible == 'true' && needs.reuse.result == 'success' && needs.reuse.outputs.proof_id || needs.qualification.outputs.proof_id }}
          path: release-evidence
          merge-multiple: true # ID downloads otherwise add an artifact-name directory, even for one ID.
      - run: npm ci

      - name: Independently verify qualified bytes and record provenance
        run: node scripts/release-reuse.mjs publication
        env:
          REUSE_QUALIFICATION: ${{ needs.reuse.result == 'success' && needs.reuse.outputs.eligible == 'true' }}
          EXPECTED_PROOF_SHA256: ${{ needs.reuse.outputs.eligible == 'true' && needs.reuse.result == 'success' && needs.reuse.outputs.proof_sha256 || needs.qualification.outputs.proof_sha256 }}
          PROOF_ARTIFACT_ID: ${{ needs.reuse.outputs.eligible == 'true' && needs.reuse.result == 'success' && needs.reuse.outputs.proof_id || needs.qualification.outputs.proof_id }}
          PROOF_ARTIFACT_DIGEST: ${{ needs.reuse.outputs.eligible == 'true' && needs.reuse.result == 'success' && needs.reuse.outputs.proof_digest || needs.qualification.outputs.proof_digest }}
      - name: Upload publication provenance
        uses: actions/upload-artifact@v4
        with:
          name: release-publication-provenance
          path: release-evidence/publication-provenance.json
          if-no-files-found: error
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION  package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION. Bump with 'npm version' so they always agree."
            exit 1
          fi

      - name: Select npm release channel
        if: github.ref_type == 'tag'
        id: channel
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tag = version.split('+')[0].includes('-') ? 'next' : 'latest';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          console.log(`Publishing ${version} to ${tag}`);
          NODE

      # The publish runs prepack's TS/board/package work. Native Cargo is
      # bypassed only after all three source-bound binary pairs verify again;
      # copy-native rehashes while staging the downloaded artifacts.
      - name: Publish to npm
        if: github.ref_type == 'tag'
        id: publish
        continue-on-error: true
        run: npm publish --provenance --access public --tag "${{ steps.channel.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RUDDER_NATIVE_PREBUILTS: ${{ github.workspace }}/prebuilt-native
          RUDDER_NATIVE_SOURCE_REVISION: ${{ github.sha }}

      # @viraatdas/rudder (the pre-3.4.0 name) is retired: nothing new is
      # published there and every version carries a deprecation notice that
      # points at @exla/rudder. Re-running it each release is idempotent.
      # Existing installs still move themselves over (src/version-check.ts).
      - name: Deprecate the old package name
        if: github.ref_type == 'tag'
        continue-on-error: true
        run: |
          npm deprecate @viraatdas/rudder "Retired. Rudder is @exla/rudder: npm uninstall -g @viraatdas/rudder && npm install -g @exla/rudder"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Fail when the new name did not publish
        if: github.ref_type == 'tag' && steps.publish.outcome != 'success'
        run: |
          echo "::error::npm publish of @exla/rudder failed (is viraatdas a publisher in the exla npm org, and can NPM_TOKEN publish to it?)"
          exit 1
