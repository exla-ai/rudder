[package]
name = "rudder-vcs-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[features]
default = []
jj = ["dep:jj-lib", "dep:async-trait", "dep:pollster", "dep:gix"]
cli = ["jj", "dep:jj-cli", "dep:clap"]
# Explicit scanner development profile. Never used by rudder-vfs-v1.
local-development = ["cli"]

[dependencies]
anyhow = "1.0"
fs2 = "0.4.3"
hex = "0.4"
libc = "0.2"
rudder-engine = { path = "../engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
async-trait = { version = "=0.1.89", optional = true }
clap = { version = "=4.6.0", features = ["derive"], optional = true }
jj-cli = { version = "=0.40.0", default-features = false, features = ["git"], optional = true }
jj-lib = { version = "=0.40.0", default-features = false, features = ["git"], optional = true }
pollster = { version = "0.4", optional = true }
gix = { version = "=0.81.0", default-features = false, features = ["sha1", "zlib-rs"], optional = true }

[dev-dependencies]
tempfile = "3"
pollster = "0.4"

[[bin]]
name = "rudder-jj"
path = "src/main.rs"
required-features = ["cli"]
