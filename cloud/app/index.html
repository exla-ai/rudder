<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Rudder</title>
  <meta name="description" content="Control your Rudder coding agents.">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rudder">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
  <link rel="stylesheet" href="/app/styles.css">
  <link rel="modulepreload" href="/app/render.js">
  <script type="module" src="/app/app.js"></script>
</head>
<body>
  <div id="shell" class="shell">
    <main id="view" class="view" aria-live="polite"></main>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-family:-apple-system,system-ui,sans-serif">Rudder needs JavaScript.</p></noscript>
</body>
</html>
