# Rudder Cloud home host (cloud/host/rudder-host-setup). Agents sandbox
# themselves with unprivileged user namespaces, and big repos need far more
# inotify watches and open files than distro defaults. A leading "-" lets
# systemd-sysctl skip a key this kernel does not have.
-kernel.apparmor_restrict_unprivileged_userns = 0
-kernel.unprivileged_userns_clone = 1
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192
vm.max_map_count = 1048576
fs.file-max = 4194304
