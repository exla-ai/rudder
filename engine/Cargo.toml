[package]
name = "rudder-engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
fs2 = "0.4.3"
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.18.0", default-features = false }
