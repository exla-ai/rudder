[package]
name = "rudder-engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
fs2 = "0.4.3"
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
toml = "1.1.8"
jj-lib = { version = "=0.40.0", default-features = false, features = ["git"] }
async-trait = "=0.1.89"
futures = "0.3.32"
tokio = { version = "1.50.0", features = ["io-util"] }
pollster = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.18.0", default-features = false }

[[bin]]
name = "rudder-execution-handoff-test"
path = "tests/fixtures/handoff_child.rs"
test = false
bench = false

[[bin]]
name = "rudder-network-qualifier"
path = "src/execution/network/qualifier.rs"
test = false
bench = false

