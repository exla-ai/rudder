[package]
name = "rudder-engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
fs2 = "0.4.3"
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.18.0", default-features = false }

# This is a disposable qualification tool, never an installed worker entrypoint.
# Cargo supplies its exact executable to integration tests; stale hashed rlibs
# from another checkout/build cannot silently become test dependencies.
[[bin]]
name = "rudder-vfs-qualifier"
path = "src/bin/vfs_qualifier.rs"
test = false
bench = false

[[bin]]
name = "rudder-execution-handoff-test"
path = "tests/fixtures/handoff_child.rs"
test = false
bench = false

[[bin]]
name = "rudder-vfs-remote-qualifier"
path = "src/bin/vfs_remote_qualifier.rs"
test = false
bench = false

[[bin]]
name = "rudder-network-qualifier"
path = "src/execution/network/qualifier.rs"
test = false
bench = false

[[bin]]
name = "rudder-remote-execution-qualifier"
path = "src/bin/remote_execution_qualifier.rs"
test = false
bench = false
