# Rudder for iOS. A native shell around the Rudder phone app (/app on the
# control plane): Google sign-in through ASWebAuthenticationSession (Google
# refuses OAuth inside web views), Sign in with Apple through the system
# sheet, the bearer token in the Keychain, and the
# app UI in a WKWebView. The version is Rudder's: `npm version` sets the two
# version keys below (scripts/version.mjs). ios/scripts/appstore.sh archives
# and uploads it on an Offstage Mac (the rudder-ios-ship skill).
#
# The Apple team (Exla Corp.) and the app's bundle id are set here and nowhere
# else: ios/scripts/identity.sh and ios/scripts/appstore.mjs read
# DEVELOPMENT_TEAM and the Rudder target's PRODUCT_BUNDLE_IDENTIFIER.
name: Rudder
options:
  bundleIdPrefix: ai.exla
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    DEVELOPMENT_TEAM: P76SY8RFGL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "5.1.4"
    CURRENT_PROJECT_VERSION: "5001004"

targets:
  Rudder:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - RudderUITests
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.exla.rudder
        # iPhone and iPad. App Store validation refuses an iPad build that does
        # not allow every orientation (Split View and Slide Over need them), so
        # Info.plist lists all four for iPad and keeps the iPhone in portrait.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        # Sign in with Apple. ios/scripts/appstore.mjs enables the matching
        # capability on the bundle id from the keys in this file.
        CODE_SIGN_ENTITLEMENTS: App/Rudder.entitlements

  # The simulator click-through (ios/scripts/qa.sh, the rudder-ios-qa skill).
  RudderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Rudder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.exla.rudder.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Rudder
