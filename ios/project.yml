# Rudder for iOS. A native shell around the Rudder phone app (/app on the
# control plane): Google sign-in through ASWebAuthenticationSession (Google
# refuses OAuth inside web views), the bearer token in the Keychain, and the
# app UI in a WKWebView. Built without xcodebuild by the ios-testflight skill's
# build-ipa.sh, which reads the two version keys below.
name: Rudder
options:
  bundleIdPrefix: dev.viraat
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    DEVELOPMENT_TEAM: 3C4383262W
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Rudder:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.viraat.rudder
        INFOPLIST_FILE: App/Info.plist
