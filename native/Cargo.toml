[package]
name = "rudder-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rudder_native"
path = "src/lib.rs"

[dependencies]
rudder-engine = { path = "../engine" }
fs2 = "0.4.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.10.9"
anyhow = "1.0"
crossterm = { version = "0.29", features = ["serde"] }
hdrhistogram = "7.5"
portable-pty = "0.9.0"
ratatui = "0.30"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16.2"
tungstenite = "0.24"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
