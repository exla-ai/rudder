# Dashboards are code: generated by grafana/build-dashboards.mjs and loaded
# read-only, so a change made in the UI never silently diverges from the repo.
apiVersion: 1
providers:
  - name: rudder
    folder: Rudder
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
