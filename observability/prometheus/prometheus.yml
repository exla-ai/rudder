# Prometheus: storage and rules. Homes and the control plane arrive through
# the collector over OTLP (--web.enable-otlp-receiver); only the scaler is
# scraped, because it is the one long-lived process that serves /metrics.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    deployment: rudder

otlp:
  # Resource attributes that every query needs as labels (observability/metrics.md).
  promote_resource_attributes:
    - rudder.home.id
    - fly.machine.id
    - fly.region
    - service.version
    - deployment.environment.name
  keep_identifying_resource_attributes: true

storage:
  tsdb:
    # Pushers retry and batch, so samples can arrive late or out of order, and
    # the local simulator backfills a few hours of history on start.
    out_of_order_time_window: 6h

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The target differs per environment (compose service name locally,
  # localhost on the Fly machine), so it lives in a mounted targets file.
  - job_name: rudder-scaler
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.yml]
